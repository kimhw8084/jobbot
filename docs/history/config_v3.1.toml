[sources.remotive]
enabled = true
url = "https://remotive.com/api/remote-jobs"

[sources.jobicy]
enabled = true
url = "https://jobicy.com/api/v2/remote-jobs?count=200&geo=usa"
minimum_poll_minutes = 60
# Jobicy's public API asks automated integrations not to poll more frequently than hourly.
# Other sources still fetch live on each run; Jobicy reuses its last successful response inside this interval.
# Targeted API queries dramatically improve daily volume while precision filtering remains local.
tags = [
  "patient enrollment", "healthcare enrollment", "patient access", "patient onboarding",
  "patient engagement", "healthcare operations", "clinical operations", "medical records",
  "health information", "healthcare quality", "quality improvement", "data quality",
  "data operations", "healthcare implementation", "project coordinator", "provider enrollment",
  "admissions", "student records", "bilingual Spanish", "credentialing", "insurance verification",
  "care coordinator", "member services", "authorization", "scheduling coordinator",
  "operations coordinator", "operations specialist", "implementation specialist", "onboarding specialist"
]
include_unfiltered_latest = true

[sources.remoteok]
enabled = true
url = "https://remoteok.com/api"

[sources.remotelanders]
enabled = true
url = "https://remotelanders.com/api/jobs"
page_size = 100
safety_max_pages = 250
# v2 continues until the source returns no more rows; safety_max_pages only prevents runaway loops.



[ats_runtime]
# Runtime-only controls. These do NOT limit how many employer boards are searched.
# Boards are scanned concurrently so a few slow/broken employers cannot make a deep run appear frozen.
max_workers = 6
board_timeout_seconds = 10
# Successful ATS responses are reused for one hour if you interrupt/restart the same run.
restart_cache_minutes = 60

[ats_discovery]
enabled = true
file = "data/discovered_ats.json"
max_boards = 1000
minimum_relevance = 75
seed_minimum_relevance = 65

[enrichment]
public_ats = true
# v2.1 enriches broad-title recall candidates BEFORE final classification.
# This fixes the v2 circular bug: missing description -> no profile -> no enrichment.
recall_first = true
jsonld_fallback = true
safety_max_enrichments_per_run = 5000
# Direct ATS canonicalization is attempted broadly; this is only a runaway/network safety ceiling.

[browser]
profile_dir = ".browser-profile"
headed = true
navigation_timeout_ms = 35000
require_https = true

[manual_platforms]
indeed = true
linkedin = true
glassdoor = true
ziprecruiter = true
builtin = true
flexjobs = true
higheredjobs = true
herc = true
insidehighered = true

[ledger]
ats_close_after_complete_misses = 2
auto_backup_before_strategy_migration = true
backup_dir = "data/backups"
# A direct ATS job is only auto-closed after it is absent from two successful complete scans.

[coverage]
primary_platforms = ["linkedin", "indeed", "glassdoor"]
boolean_bundle_size = 4
windows_days = [1, 7, 30]
# These are user-assisted search coverage segments, not autonomous scraping.
# 1d and 7d segments recur daily; 30d backfill recurs weekly.
