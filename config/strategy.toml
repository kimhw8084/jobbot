[strategy]
version = "3.2.0"
name = "Bilingual Healthcare Operations & Data Quality"
primary_platforms = ["linkedin", "indeed", "glassdoor"]
remote_required = true

[strategy.portfolio]
healthcare_percent = 80
higher_ed_percent = 15
content_ai_percent = 5
fallback_lane = "FALLBACK_TRANSFERABLE"

[strategy.run_modes.fast]
max_priority = 1
include_core_only = true

[strategy.run_modes.deep]
max_priority = 3
include_core_only = true

[strategy.execution]
# Retrieval order is independent of portfolio allocation and qualification.
# These are the fastest-door searches for the first live results; every other
# configured title remains in the plan after this explicit prefix.
fast_first_queries = [
  "Patient Enrollment Specialist", "Patient Access Specialist",
  "Healthcare Operations Coordinator",
  "Patient Enrollment Coordinator", "Healthcare Enrollment Specialist",
  "Healthcare Enrollment Coordinator", "Member Enrollment Specialist",
  "Member Enrollment Coordinator", "Patient Access Representative",
  "Patient Access Associate", "Patient Registration Specialist",
  "Patient Registration Coordinator", "Insurance Verification Specialist",
  "Benefits Verification Specialist", "Patient Services Specialist",
  "Patient Services Coordinator", "Patient Support Specialist", "Member Services Specialist",
  "Member Support Specialist",
  "Healthcare Operations Specialist", "Patient Operations Coordinator",
  "Patient Operations Specialist", "Care Operations Coordinator", "Care Operations Specialist",
  "Healthcare Intake Specialist", "Patient Intake Specialist", "Patient Onboarding Specialist",
  "Clinical Onboarding Specialist", "Behavioral Health Intake Coordinator",
  "Bilingual Enrollment Coordinator", "Eligibility Specialist",
  "Patient Outreach Representative", "Member Engagement Coordinator"
]

# Search bands are independent of career-lane allocation.  They control
# retrieval order, cadence, and detail hydration priority only; all scoped
# cards are still persisted and every enabled core definition remains in the
# uncapped plan.
[strategy.search_band_cadence]
gold_hours = 6
silver_hours = 12
growth_hours = 24
hedge_hours = 48
deep_tail_hours = 168

[strategy.search_deep_cadence]
# Historical deep windows repeat weekly regardless of the freshness band.
hours = 168

[strategy.search_bands]
gold_titles = [
  "Patient Enrollment Specialist", "Patient Enrollment Coordinator",
  "Healthcare Enrollment Specialist", "Healthcare Enrollment Coordinator",
  "Member Enrollment Specialist", "Member Enrollment Coordinator",
  "Bilingual Enrollment Coordinator", "Patient Access Specialist",
  "Patient Access Representative", "Patient Access Associate",
  "Patient Registration Specialist", "Patient Registration Coordinator",
  "Patient Intake Specialist", "Healthcare Intake Specialist",
  "Patient Onboarding Specialist", "Insurance Verification Specialist",
  "Benefits Verification Specialist", "Eligibility Specialist", "Healthcare Eligibility Specialist",
  "Patient Services Specialist",
  "Patient Services Coordinator", "Patient Support Specialist",
  "Patient Outreach Representative", "Member Engagement Coordinator",
  "Behavioral Health Intake Coordinator",
  "Remote Patient Monitoring Coordinator", "RPM Coordinator"
]
silver_titles = [
  "Medical Records Specialist", "Medical Records Coordinator",
  "ROI Medical Records Specialist", "Health Information Operations Coordinator",
  "Provider Services Representative", "Provider Services Coordinator",
  "Referral Coordinator", "Referral Specialist", "Healthcare Operations Coordinator",
  "Healthcare Operations Specialist", "Provider Enrollment Specialist",
  "Provider Enrollment Coordinator", "Provider Enrollment Representative",
  "Credentialing Associate", "Credentialing Coordinator",
  "Patient Engagement Specialist", "Member Engagement Specialist",
  "Member Services Specialist", "Member Support Specialist",
  "Customer Operations Coordinator — Healthcare", "Customer Operations Specialist — Healthcare"
]
growth_titles = [
  "Healthcare Data Quality Specialist", "Data Quality Specialist — Healthcare",
  "Healthcare Data Operations Specialist", "Healthcare Data Operations Coordinator",
  "Quality Operations Specialist — Healthcare", "Quality Operations Coordinator — Healthcare",
  "Healthcare Quality Analyst", "Healthcare Implementation Coordinator",
  "Healthcare Implementation Specialist", "Healthcare Project Coordinator",
  "Operations Project Coordinator — Healthcare", "Business Process Analyst — Healthcare",
  "Healthcare Data Analyst", "Clinical Data Analyst", "Healthcare Reporting Analyst",
  "Quality Improvement Specialist"
]
# Higher-ed/EdTech and content/AI quality are deliberately protected as a
# hedge, but run after the healthcare reservoir has had first opportunity.
hedge_lanes = ["HIGHER_ED_EDTECH", "CONTENT_AI_QUALITY"]
classification_only_titles = ["Healthcare Eligibility Specialist"]

[strategy.query_text_overrides]
# Keep the canonical role label for lane attribution while using natural
# market vocabulary for generic searches.
"Eligibility Specialist" = { query_text = "healthcare eligibility specialist", query_variants = ["enrollment and eligibility representative"], explanatory_aliases = ["Eligibility Specialist"] }
"Patient Outreach Representative" = { query_text = "patient outreach representative", query_variants = ["bilingual patient outreach"] }
"Business Process Analyst — Healthcare" = { query_text = "healthcare business process analyst", query_variants = ["healthcare process analyst"] }
"Quality Operations Specialist — Healthcare" = { query_text = "healthcare quality operations specialist", query_variants = ["healthcare quality specialist"] }
"Quality Operations Coordinator — Healthcare" = { query_text = "healthcare quality operations coordinator", query_variants = ["healthcare quality coordinator"] }

[strategy.resume_routing]
# These lanes do not have a separate file in the candidate registry.  Route to
# the existing healthcare QA document rather than inventing a missing resume.
HEALTHCARE_QUALITY_DATA = { variant = "healthcare_qa", rationale = "existing healthcare QA resume truthfully covers documentation, quality, reconciliation, and data-accuracy work" }
HEALTHCARE_IMPLEMENTATION = { variant = "healthcare_qa", rationale = "existing healthcare QA resume is the closest truthful workflow/process resume for implementation coordination" }
FALLBACK_TRANSFERABLE = { variant = "healthcare_qa", rationale = "fallback remains limited to existing healthcare QA evidence; no fabricated data-quality resume" }

