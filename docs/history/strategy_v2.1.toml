# Elizabeth Kim-Ortiz — Remote Career Search Strategy v2.1 Recall + Verification + Precision
# Frozen strategy date: 2026-09-06
# Objective: sustain a large application pipeline (10–20/day; 500+ cumulative)
# without allowing unrelated jobs into the application queue.

[strategy]
version = "2.1"
objective = "fastest_good_door_at_scale"
remote_only = true
primary_career_thesis = "regulated healthcare operations -> data/quality -> analytics/implementation/project ownership"
primary_resume_positioning = "Bilingual Healthcare Operations & Data Quality Specialist"

[strategy.throughput]
daily_target = 15
daily_minimum = 10
daily_maximum = 20
cumulative_application_goal = 500
max_same_company_per_day = 2
max_same_title_family_per_day = 4
# Do not lower relevance/qualification thresholds just to hit the target.
fill_from_stretch_if_needed = true

[strategy.allocation]
healthcare_access = 0.50
healthcare_growth_bridge = 0.25
transferable_data_ops = 0.10
higher_ed_edtech_hedge = 0.12
content_ai_opportunistic = 0.03

[strategy.remote]
accepted_markers = [
  "fully remote", "100% remote", "remote - united states", "remote, us",
  "us remote", "remote in texas", "remote - texas", "work from home",
  "remote-first", "remote first", "home-based", "home based"
]
reject_markers = [
  "hybrid required", "on-site required", "onsite required", "in-person required",
  "not a fully remote position", "expected to work onsite", "expected to work on-site",
  "work onsite", "work on-site", "in office 5 days", "in-office 5 days",
  "onsite three days", "on-site three days", "onsite four days", "on-site four days"
]
state_of_interest = "TX"
unknown_state_restriction_action = "review"
state_restricted_without_tx_action = "reject"
travel_0_to_10_percent = "allow"
travel_11_to_25_percent = "review"
travel_over_25_percent = "reject"

