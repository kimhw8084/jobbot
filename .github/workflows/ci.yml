name: core
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --editable .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: python -m jobbot search-plan --mode deep
      - name: Run JavaScript scope and workspace harnesses
        shell: bash
        run: |
          node tests/extension_linkedin_scope_test.js
          node tests/extension_primary_scope_test.js
          node tests/extension_workspace_test.js
      - name: Validate extension JavaScript
        shell: bash
        run: |
          for file in extension/*.js; do node --check "$file"; done
          for file in src/jobbot/web/*.js; do node --check "$file"; done
      - name: Validate POSIX launchers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for file in *.command; do bash -n "$file"; done
          for file in scripts/*.sh; do bash -n "$file"; done
      - name: Run doctor on POSIX
        if: runner.os != 'Windows'
        run: python -m jobbot doctor
