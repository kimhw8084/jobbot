# Remote Career Job Search Automation v2.1 — exhaustive ledger + precision + throughput

[app]
strategy_file = "strategy.toml"
db_path = "data/jobs.sqlite3"
output_dir = "out"
cache_dir = "cache"
cache_minutes = 0
# 0 = fetch live every manual run. Cached responses are still retained only as stale fallback after a network/source failure.
http_timeout_seconds = 25
user_agent = "ElizabethRemoteCareerSearch/2.1 (personal job-search research)"
safety_max_jobs_per_source = 50000
# Safety ceiling only: this is NOT a strategic top-N limit. Raise intentionally if a legitimate source exceeds it.

[candidate]
name = "Elizabeth Kim-Ortiz"
country = "US"
state = "TX"
metro = "Austin Metropolitan Area"
metro_terms = ["Austin", "Round Rock", "Cedar Park", "Pflugerville", "Georgetown"]
remote_only = true
work_authorization = "unknown"
minimum_salary_annual = 0
preferred_salary_annual = 65000
max_travel_percent = -1
primary_employment = "full_time_stable"
include_fixed_term_review = true
include_contract_review = false
include_part_time_review = false
# -1 = no hard travel cap yet. Travel is still extracted/ranked and shown for review.
relevant_operations_years = 4.0
direct_healthcare_years = 3.0
enrollment_years = 2.0
higher_ed_years = 1.7
remote_operations_years = 4.0
people_management_years = 0.0
professional_data_analytics_years = 0.0
professional_implementation_years = 0.0

education = [
  "Master of Arts, Clinical Mental Health Counseling",
  "Bachelor of Arts, Psychology",
]
credentials = [
  "Google Data Analytics Professional Certificate",
  "HIPAA Compliance Training",
  "Crisis Intervention Training",
]
languages = ["English native", "Spanish fluent written and verbal"]

